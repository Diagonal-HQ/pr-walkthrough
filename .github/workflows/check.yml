name: Check and render demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:timeline
      - run: npm run test:audio
      - run: npm run test:narration
      - run: npm run test:contracts
      - run: npm run walkthrough -- doctor
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-demo
          path: |
            .walkthrough/demo/out/
            .walkthrough/demo/review/
          if-no-files-found: ignore
          retention-days: 7
